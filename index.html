<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOer - Do It. Doo It. Doing.</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f0;--ink:#22301f;--dim:#7d8a74;--green:#439a46;--line:#e3e2d8;--card:#ffffff}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Sora',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:44px 16px 64px}
h1{font-size:36px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--dim);font-size:13px;letter-spacing:.4px;margin-top:5px}
#stats{margin:24px 0 16px;font-size:11.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--dim);text-align:center;line-height:2}
#stats b{color:var(--green);margin:0 3px}
#addrow{display:flex;gap:8px;width:min(560px,94vw)}
#task{flex:1;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-family:inherit;font-size:14px;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}
#task:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(67,154,70,.14)}
#add{padding:13px 20px;border-radius:12px;border:none;background:var(--green);color:#fff;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .15s}
#add:hover{background:#37853a}
#fanfare{margin-top:14px;min-height:10px}
#fanfare .t{display:inline-block;background:#e7f3e4;border:1px solid #cfe6cc;color:var(--green);font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:999px}
#list{width:min(560px,94vw);margin-top:18px;display:grid;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:8px;font-size:14px}
.item button{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-family:inherit;font-size:12px;color:var(--dim);cursor:pointer;transition:all .15s}
.item button:first-of-type{margin-left:auto}
.item button:hover{border-color:var(--green);color:var(--green)}
</style>
</head>
<body>
<h1>Dooer</h1>
<div class="sub">do it &middot; doo it &middot; doing</div>
<div id="stats"></div>
<div id="addrow">
<input id="task" placeholder="thing to doo" maxlength="80">
<button id="add">Doo it later</button>
</div>
<div id="fanfare"></div>
<div id="list"></div>
<script>
const $=id=>document.getElementById(id);
let items=JSON.parse(localStorage.getItem('dooer')||'[]');
let doneTotal=parseInt(localStorage.getItem('dooer-done')||'0');
function save(){localStorage.setItem('dooer',JSON.stringify(items));localStorage.setItem('dooer-done',doneTotal);}
const CHEERS=['DOOED.','Absolutely dooed.','That thing? Dooed.','Doing complete.','The doing has been done.','Doo count rising.'];
function render(){
 $('stats').innerHTML='TO DOO <b>'+items.filter(i=>!i.done).length+'</b> &middot; DOOED TODAY-ISH <b>'+doneTotal+'</b>';
 const el=$('list');el.innerHTML='';
 items.forEach((t,i)=>{
  const d=document.createElement('div');d.className='item'+(t.done?' done':'');
  d.innerHTML='<div class="t">'+t.text.replace(/</g,'&lt;')+'</div>';
  const dn=document.createElement('button');dn.textContent=t.done?'undoo':'doo it';
  dn.onclick=()=>{t.done=!t.done;if(t.done){doneTotal++;$('fanfare').textContent=CHEERS[Math.floor(Math.random()*CHEERS.length)];}save();render();};
  const del=document.createElement('button');del.textContent='x';
  del.onclick=()=>{items.splice(i,1);save();render();};
  d.appendChild(dn);d.appendChild(del);el.appendChild(d);});
}
$('add').onclick=()=>{const t=$('task').value.trim();if(!t)return;items.unshift({text:t,done:false});$('task').value='';save();render();};
$('task').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click();});
if(!items.length)items=[{text:'Try the doo button',done:false}];
render();
</script>
</body>
</html>
