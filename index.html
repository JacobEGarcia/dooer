<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOOer - Do It. Doo It. Doing.</title>
<style>
:root{--bg:#0d120b;--ink:#e4edd8;--dim:#8a9678;--accent:#84cc16;--line:#232e18;--card:#161f0e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}
h1{font-size:26px;letter-spacing:6px;color:var(--accent);text-transform:uppercase}
.sub{color:var(--dim);letter-spacing:2px;font-size:10.5px;text-transform:uppercase;margin-top:6px}
#stats{font-size:12px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin:16px 0;line-height:2;text-align:center}
#stats b{color:var(--accent)}
#addrow{display:flex;gap:8px;width:min(560px,94vw)}
input{background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--ink);font-family:inherit;font-size:13px;padding:11px 12px;flex:1;outline:none}
input:focus{border-color:var(--accent)}
button{cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px 14px;font-family:inherit;font-size:12.5px;letter-spacing:1px;text-transform:uppercase;transition:border-color .15s}
button:hover{border-color:var(--accent)}
#list{width:min(560px,94vw);margin-top:14px;display:grid;gap:9px}
.item{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 15px;display:flex;align-items:center;gap:12px}
.item .t{flex:1;font-size:13.5px}
.item button{padding:7px 10px;font-size:11px}
.done{opacity:.5}.done .t{text-decoration:line-through}
#fanfare{margin-top:10px;min-height:22px;font-size:13px;color:var(--accent);text-align:center}
</style>
</head>
<body>
<h1>DOOer</h1>
<div class="sub">do it &middot; doo it &middot; doing app</div>
<div id="stats"></div>
<div id="addrow">
<input id="task" placeholder="thing to doo" maxlength="80">
<button id="add">Doo it later</button>
</div>
<div id="fanfare"></div>
<div id="list"></div>
<script>
const $=id=>document.getElementById(id);
let items=JSON.parse(localStorage.getItem('dooer')||'[]');
let doneTotal=parseInt(localStorage.getItem('dooer-done')||'0');
function save(){localStorage.setItem('dooer',JSON.stringify(items));localStorage.setItem('dooer-done',doneTotal);}
const CHEERS=['DOOED.','Absolutely dooed.','That thing? Dooed.','Doing complete.','The doing has been done.','Doo count rising.'];
function render(){
 $('stats').innerHTML='TO DOO <b>'+items.filter(i=>!i.done).length+'</b> &middot; DOOED TODAY-ISH <b>'+doneTotal+'</b>';
 const el=$('list');el.innerHTML='';
 items.forEach((t,i)=>{
  const d=document.createElement('div');d.className='item'+(t.done?' done':'');
  d.innerHTML='<div class="t">'+t.text.replace(/</g,'&lt;')+'</div>';
  const dn=document.createElement('button');dn.textContent=t.done?'undoo':'doo it';
  dn.onclick=()=>{t.done=!t.done;if(t.done){doneTotal++;$('fanfare').textContent=CHEERS[Math.floor(Math.random()*CHEERS.length)];}save();render();};
  const del=document.createElement('button');del.textContent='x';
  del.onclick=()=>{items.splice(i,1);save();render();};
  d.appendChild(dn);d.appendChild(del);el.appendChild(d);});
}
$('add').onclick=()=>{const t=$('task').value.trim();if(!t)return;items.unshift({text:t,done:false});$('task').value='';save();render();};
$('task').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click();});
if(!items.length)items=[{text:'Try the doo button',done:false}];
render();
</script>
</body>
</html>
